name: lemon_ui
description: A Flutter UI package under active redesign.
version: 0.0.1

environment:
  sdk: ^3.13.0
  flutter: ">=3.3.0"

dependencies:
  flutter:
    sdk: flutter
  trina_grid: ^2.3.0
  fl_chart: ^1.3.0
  file_picker: ^13.3.0
  desktop_drop: ^0.8.4
  cross_file: ^0.3.5+5
  lucide_icons_flutter: ^4.0.1
  characters: ^1.4.1

dev_dependencies:
  fake_async: ^1.3.3
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

# trina_grid 2.3.0 -> shadcn_ui 0.55.x still constrains Lucide to 3.x.
# Its regular icon API is compatible with 4.x; remove when upstream permits 4.x.
dependency_overrides:
  lucide_icons_flutter: ^4.0.1

flutter:
