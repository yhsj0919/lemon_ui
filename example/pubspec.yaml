name: lemon_ui_example
description: Example application for the lemon_ui package.
publish_to: none
version: 1.0.0+1

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  lemon_ui:
    path: ..
  lemon_x:
    git:
      url: https://github.com/yhsj0919/lemon_x.git
      ref: b6f715b357ab28ca3e60cbcb307ca4a0dd425d71
  shared_preferences: ^2.5.6
  cupertino_icons: ^2.0.0

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

# Match the root override until trina_grid permits Lucide 4.x.
dependency_overrides:
  lucide_icons_flutter: ^4.0.1

flutter:
  uses-material-design: true
